<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recap with Tarbin Studio</title>
  <style>
    :root {
      --bg: #0b0f19; --card: #151c2c; --accent: #0284c7;
      --accent-hover: #0369a1; --text: #f8fafc; --text-sub: #94a3b8; --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .studio { width: 100%; max-width: 680px; background: var(--card); border-radius: 16px; padding: 24px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .header h1 { font-size: 22px; color: #38bdf8; }
    
    /* Navigation Tabs */
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .tab-btn { flex: 1; padding: 12px; background: #0f172a; border: 1px solid var(--border); color: var(--text-sub); border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .section-title { font-size: 13px; font-weight: 600; color: #38bdf8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; margin-bottom: 6px; }
    input[type="file"], select, input[type="range"] { width: 100%; padding: 10px; border-radius: 8px; background: #0f172a; border: 1px solid var(--border); color: #fff; font-size: 14px; outline: none; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .preview-box { width: 100%; max-height: 240px; background: #000; border-radius: 8px; margin-top: 10px; display: none; }
    .panel { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
    .checkbox-group input { width: auto; }
    
    button.action-btn { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 12px; }
    button.action-btn:hover { background: var(--accent-hover); }
    
    .status-msg { margin-top: 12px; font-size: 14px; text-align: center; color: #38bdf8; word-break: break-word; }
  </style>
</head>
<body>

<div class="studio">
  <div class="header">
    <h1>Recap with Tarbin Studio</h1>
    <p>AI Video Recap & Post-Processing Editor Engine</p>
  </div>

  <!-- Tab Navigation Header -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('recapTab', this)">၁။ AI Video Recap</button>
    <button class="tab-btn" onclick="switchTab('editorTab', this)">၂။ Blur & Logo Editor</button>
  </div>

  <!-- TAB 1: AI VIDEO RECAP STUDIO -->
  <div id="recapTab" class="tab-content active">
    <div class="form-group">
      <div class="section-title">၁။ Video Source</div>
      <label>မူရင်း ဗီဒီယိုဖိုင် တင်ပါ -</label>
      <input type="file" id="recapVideoInput" accept="video/*" onchange="previewVideo(event, 'recapPreview')">
      <video id="recapPreview" class="preview-box" controls></video>
    </div>

    <div class="form-group grid-2">
      <div>
        <label>Recap ကြာချိန် -</label>
        <select id="duration">
          <option value="60">၁ မိနစ် (Shorts)</option>
          <option value="180" selected>၃ မိနစ် (Standard)</option>
          <option value="300">၅ မိနစ် (Detailed)</option>
        </select>
      </div>
      <div>
        <label>အသံအမြန်နှုန်း -</label>
        <select id="voiceSpeed">
          <option value="+0%">ပုံမှန် (1.0x)</option>
          <option value="+15%" selected>အနည်းငယ်မြန် (1.15x)</option>
          <option value="+30%">မြန် (1.30x)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Voice Over အသံ ရွေးချယ်ပါ -</label>
      <select id="voiceType">
        <optgroup label="👨 အမျိုးသား အသံများ">
          <option value="koko">ကိုကို - တည်ငြိမ်တဲ့ အသံ</option>
          <option value="nyinyi" selected>ညီညီ - Recap ပြောသည့် အသံ</option>
          <option value="maungmaung">မောင်မောင် - စိတ်ခံစားမှု အသံ</option>
          <option value="u_paing">ဦးပိုင် - လူကြီး အသံ</option>
        </optgroup>
        <optgroup label="👩 အမျိုးသမီး အသံများ">
          <option value="hlahla">လှလှ - တည်ငြိမ်တဲ့ အသံ</option>
          <option value="myamya">မြမြ - Recap ပြောသည့် အသံ</option>
          <option value="yuya">ယုယ - စိတ်ခံစားမှု အသံ</option>
          <option value="daw_myalay">ဒေါ်မြလေး - လူကြီး အသံ</option>
        </optgroup>
      </select>
    </div>

    <div class="form-group grid-2">
      <div>
        <label>Tone & Mood Style -</label>
        <select id="toneMood">
          <option value="Dramatic & Suspenseful" selected>စိတ်လှုပ်ရှားဖွယ် (Dramatic)</option>
          <option value="Emotional & Touchy">ဝမ်းနည်း/စိတ်ခံစားမှု (Emotional)</option>
          <option value="Humorous & Funny">ဟာသ/ပေါ့ပါးသော (Comedy)</option>
          <option value="Mysterious & Thriller">သဲထိတ်ရင်ဖို (Mystery)</option>
        </select>
      </div>
      <div>
        <label>Pacing -</label>
        <select id="pacing">
          <option value="Fast & Energetic" selected>သွက်လက်၍ စိတ်ဝင်စားဖွယ်</option>
          <option value="Slow & Serious">လေးနက်၍ တည်ငြိမ်စွာ</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="checkbox-group">
        <input type="checkbox" id="includeOutro" checked>
        'History With Tarbin' Branding Outro ထည့်သွင်းမည်
      </label>
    </div>

    <button class="action-btn" onclick="startRecapProcess()">Recap Video စတင်ဖန်တီးမည်</button>

    <div id="recapStatus" class="status-msg"></div>
    <video id="recapOutputVideo" class="preview-box" controls></video>
  </div>

  <!-- TAB 2: STANDALONE BLUR & LOGO EDITOR -->
  <div id="editorTab" class="tab-content">
    <div class="form-group">
      <div class="section-title">၁။ Edit ပြုလုပ်မည့် Video File</div>
      <label>ဗီဒီယိုဖိုင် တင်ပါ -</label>
      <input type="file" id="editorVideoInput" accept="video/*" onchange="previewVideo(event, 'editorPreview')">
      <video id="editorPreview" class="preview-box" controls></video>
    </div>

    <div class="panel">
      <div class="section-title">၂။ Text Blur Controls</div>
      <label class="checkbox-group">
        <input type="checkbox" id="enableBlur"> စာများကို ဝါးမည် (Text Blur)
      </label>
      <div class="grid-2" style="margin-top: 8px;">
        <div>
          <label>နေရာ -</label>
          <select id="blurPosition">
            <option value="bottom" selected>အောက်ခြေ</option>
            <option value="top">အပေါ်ပိုင်း</option>
            <option value="center">အလယ်</option>
          </select>
        </div>
        <div>
          <label>ပမာဏ -</label>
          <select id="blurSize">
            <option value="small">Light</option>
            <option value="medium" selected>Medium</option>
            <option value="large">Strong</option>
          </select>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="section-title">၃။ Logo Watermark Controls</div>
      <label>Logo ပုံ တင်ပါ -</label>
      <input type="file" id="logoInput" accept="image/*">
      <div class="grid-2" style="margin-top: 8px;">
        <div>
          <label>တည်နေရာ -</label>
          <select id="logoPosition">
            <option value="top-right" selected>အပေါ် ညာ</option>
            <option value="top-left">အပေါ် ဘယ်</option>
            <option value="bottom-right">အောက် ညာ</option>
            <option value="bottom-left">အောက် ဘယ်</option>
          </select>
        </div>
        <div>
          <label>Size: <span id="logoVal">80</span>px</label>
          <input type="range" id="logoSize" min="40" max="200" value="80" oninput="document.getElementById('logoVal').innerText=this.value">
        </div>
      </div>
    </div>

    <button class="action-btn" style="background:#16a34a;" onclick="startEditorProcess()">Blur & Logo Render မည်</button>

    <div id="editorStatus" class="status-msg"></div>
    <video id="editorOutputVideo" class="preview-box" controls></video>
  </div>
</div>

<script>
  const BACKEND_URL = "https://recap-with-tarbin.onrender.com";

  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  function previewVideo(event, previewId) {
    const file = event.target.files[0];
    const preview = document.getElementById(previewId);
    if (file) {
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    }
  }

  async function startRecapProcess() {
    const fileInput = document.getElementById('recapVideoInput');
    const status = document.getElementById('recapStatus');
    const player = document.getElementById('recapOutputVideo');

    if (!fileInput.files[0]) return alert("ဗီဒီယို ဖိုင် ရွေးပေးပါ။");

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    formData.append("duration", document.getElementById('duration').value);
    formData.append("voice_speed", document.getElementById('voiceSpeed').value);
    formData.append("voice_type", document.getElementById('voiceType').value);
    formData.append("tone_mood", document.getElementById('toneMood').value);
    formData.append("pacing", document.getElementById('pacing').value);
    formData.append("include_outro", document.getElementById('includeOutro').checked);

    status.innerText = "Gemini AI မှ Recap ဖန်တီးနေပါသည် (ခဏစောင့်ပေးပါ)...";
    player.style.display = "none";

    try {
      const res = await fetch(`${BACKEND_URL}/process-recap`, { method: "POST", body: formData });
      if (!res.ok) throw new Error("Recap မထုတ်နိုင်ပါ။ Server တွင် အမှားဖြစ်နေပါသည်။");

      const blob = await res.blob();
      player.src = URL.createObjectURL(blob);
      player.style.display = "block";
      status.innerText = "🎬 Recap ဖန်တီးမှု ပြီးစီးပါပြီ။";
    } catch (err) {
      status.innerText = "အမှား - " + err.message;
    }
  }

  async function startEditorProcess() {
    const fileInput = document.getElementById('editorVideoInput');
    const logoInput = document.getElementById('logoInput');
    const status = document.getElementById('editorStatus');
    const player = document.getElementById('editorOutputVideo');

    if (!fileInput.files[0]) return alert("Edit မည့် ဗီဒီယို ဖိုင် ရွေးပေးပါ။");

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    formData.append("enable_blur", document.getElementById('enableBlur').checked);
    formData.append("blur_position", document.getElementById('blurPosition').value);
    formData.append("blur_size", document.getElementById('blurSize').value);

    if (logoInput.files[0]) formData.append("logo_file", logoInput.files[0]);
    formData.append("logo_position", document.getElementById('logoPosition').value);
    formData.append("logo_size", document.getElementById('logoSize').value);

    status.innerText = "Blur နှင့် Logo ကို Render ပြုလုပ်နေပါသည်...";
    player.style.display = "none";

    try {
      const res = await fetch(`${BACKEND_URL}/apply-editor`, { method: "POST", body: formData });
      if (!res.ok) throw new Error("Editing အဆင်မပြေပါ။");

      const blob = await res.blob();
      player.src = URL.createObjectURL(blob);
      player.style.display = "block";
      status.innerText = "✅ Edit လုပ်ပြီးသော Final Video ရရှိပါပြီ။";
    } catch (err) {
      status.innerText = "အမှား - " + err.message;
    }
  }
</script>

</body>
</html>
