<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recap Studio Pro</title>
  <style>
    :root { --bg: #0b0f19; --card: #151c2c; --accent: #0284c7; --text: #f8fafc; --border: #1e293b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .studio { width: 100%; max-width: 680px; background: var(--card); border-radius: 16px; padding: 24px; border: 1px solid var(--border); }
    .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .header h1 { font-size: 22px; color: #38bdf8; }
    .section-title { font-size: 13px; font-weight: 600; color: #38bdf8; margin-bottom: 8px; text-transform: uppercase; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; margin-bottom: 6px; }
    input[type="file"], select, input[type="range"] { width: 100%; padding: 10px; border-radius: 8px; background: #0f172a; border: 1px solid var(--border); color: #fff; font-size: 14px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .preview-box { width: 100%; max-height: 250px; background: #000; border-radius: 8px; margin-top: 10px; display: none; }
    .panel { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }
    button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    #status { margin-top: 12px; font-size: 14px; text-align: center; color: #38bdf8; }
    .editor-section { margin-top: 24px; border-top: 2px dashed var(--accent); padding-top: 16px; display: none; }
  </style>
</head>
<body>

<div class="studio">
  <div class="header">
    <h1>Recap with Tarbin Studio</h1>
    <p>AI Video Recap & Post-Editor Engine</p>
  </div>

  <!-- STEP 1: RECAP CREATION -->
  <div class="form-group">
    <div class="section-title">STEP 1: RECAP ဖန်တီးမည်</div>
    <label>ဗီဒီယိုဖိုင် တင်ပါ -</label>
    <input type="file" id="videoInput" accept="video/*" onchange="previewInputVideo(event)">
    <video id="inputPreview" class="preview-box" controls></video>
  </div>

  <div class="form-group grid-2">
    <div>
      <label>Recap ကြာချိန် -</label>
      <select id="duration">
        <option value="60">၁ မိနစ် (Shorts)</option>
        <option value="180" selected>၃ မိနစ် (Standard)</option>
      </select>
    </div>
    <div>
      <label>Voice Over -</label>
      <select id="voiceType">
        <option value="nyinyi" selected>ညီညီ (Recap သံ)</option>
        <option value="koko">ကိုကို (တည်ငြိမ်)</option>
        <option value="myamya">မြမြ (အမျိုးသမီး)</option>
      </select>
    </div>
  </div>

  <button onclick="generateRecap()">၁။ Recap Video အရင်ထုတ်မည်</button>

  <div id="status"></div>
  <video id="outputVideo" class="preview-box" controls></video>

  <!-- STEP 2: BLUR & LOGO POST EDITOR -->
  <div id="editorSection" class="editor-section">
    <div class="section-title">STEP 2: BLUR & LOGO ပြင်ဆင်မည် (OPTIONAL)</div>

    <!-- Blur Controls -->
    <div class="panel">
      <label style="display:flex; gap:8px; cursor:pointer;">
        <input type="checkbox" id="enableBlur"> ဗီဒီယိုထဲမှ စာများကို ဝါးမည် (Text Blur)
      </label>
      <div class="grid-2" style="margin-top: 8px;">
        <select id="blurPosition">
          <option value="bottom" selected>အောက်ခြေ စာတန်းများ</option>
          <option value="top">အပေါ်ပိုင်း စာတန်းများ</option>
        </select>
        <select id="blurSize">
          <option value="medium" selected>အသင့်အတင့် ဝါးမည်</option>
          <option value="large">အပြည့်အဝ ဝါးမည်</option>
        </select>
      </div>
    </div>

    <!-- Logo Controls -->
    <div class="panel">
      <label>Brand Logo တင်ပါ (PNG) -</label>
      <input type="file" id="logoInput" accept="image/*">
      <div class="grid-2" style="margin-top: 8px;">
        <select id="logoPosition">
          <option value="top-right" selected>အပေါ် ညာဘက်</option>
          <option value="top-left">အပေါ် ဘယ်ဘက်</option>
          <option value="bottom-right">အောက် ညာဘက်</option>
        </select>
        <div>
          <label>Logo Size: <span id="logoVal">80</span>px</label>
          <input type="range" id="logoSize" min="40" max="180" value="80" oninput="document.getElementById('logoVal').innerText=this.value">
        </div>
      </div>
    </div>

    <button onclick="applyEdits()" style="background:#16a34a;">၂။ Blur & Logo ထည့်သွင်း၍ Render ပြုလုပ်မည်</button>
  </div>
</div>

<script>
  let rawRecapBlob = null;

  function previewInputVideo(e) {
    const file = e.target.files[0];
    const preview = document.getElementById('inputPreview');
    if (file) { preview.src = URL.createObjectURL(file); preview.style.display = 'block'; }
  }

  async function generateRecap() {
    const fileInput = document.getElementById('videoInput');
    const status = document.getElementById('status');
    const player = document.getElementById('outputVideo');
    const editor = document.getElementById('editorSection');

    if (!fileInput.files[0]) return alert("ဗီဒီယို ရွေးပေးပါ။");

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    formData.append("duration", document.getElementById('duration').value);
    formData.append("voice_type", document.getElementById('voiceType').value);

    status.innerText = "Gemini AI မှ Recap ဖန်တီးနေပါသည်...";
    player.style.display = "none";
    editor.style.display = "none";

    try {
      const res = await fetch("https://recap-with-tarbin.onrender.com/process-recap", { method: "POST", body: formData });
      if (!res.ok) throw new Error("Recap မထုတ်နိုင်ပါ။");

      rawRecapBlob = await res.blob();
      player.src = URL.createObjectURL(rawRecapBlob);
      player.style.display = "block";
      editor.style.display = "block"; // Show Step 2 Panel
      status.innerText = "🎬 Recap ဗီဒီယို ထွက်လာပါပြီ။ အောက်တွင် စာဝါးခြင်း/Logo ထည့်ခြင်းများ ထပ်မံပြုလုပ်နိုင်ပါသည်။";
    } catch (err) {
      status.innerText = "အမှား - " + err.message;
    }
  }

  async function applyEdits() {
    if (!rawRecapBlob) return alert("Recap ဗီဒီယို မရှိသေးပါ။");

    const status = document.getElementById('status');
    const player = document.getElementById('outputVideo');
    const logoInput = document.getElementById('logoInput');

    const formData = new FormData();
    formData.append("file", rawRecapBlob, "recap.mp4");
    formData.append("enable_blur", document.getElementById('enableBlur').checked);
    formData.append("blur_position", document.getElementById('blurPosition').value);
    formData.append("blur_size", document.getElementById('blurSize').value);

    if (logoInput.files[0]) formData.append("logo_file", logoInput.files[0]);
    formData.append("logo_position", document.getElementById('logoPosition').value);
    formData.append("logo_size", document.getElementById('logoSize').value);

    status.innerText = "Blur နှင့် Logo ကို Render ပြုလုပ်နေပါသည်...";

    try {
      const res = await fetch("https://recap-with-tarbin.onrender.com/apply-editor", { method: "POST", body: formData });
      if (!res.ok) throw new Error("Editing အဆင်မပြေပါ။");

      const editedBlob = await res.blob();
      player.src = URL.createObjectURL(editedBlob);
      status.innerText = "✅ Edit လုပ်ပြီးသော Final Video ရရှိပါပြီ။";
    } catch (err) {
      status.innerText = "အမှား - " + err.message;
    }
  }
</script>

</body>
</html>
